name: Deploy to GitHub Pages

# Основной сайт живёт на своём сервере (см. deploy-vps.yml).
# Старый адрес whsmotilek.github.io/unick перенаправляет туда с сохранением пути,
# чтобы ранее разосланные ссылки продолжали работать.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Страница-редирект
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          mkdir -p dist
          cat > dist/index.html <<HTML
          <!DOCTYPE html>
          <html lang="ru"><head><meta charset="utf-8"><title>Unick переехал</title>
          <meta name="robots" content="noindex">
          <script>
            var p = location.pathname.replace(/^\/unick/, '') || '/';
            location.replace('${APP_URL}' + p + location.search + location.hash);
          </script>
          <meta http-equiv="refresh" content="0; url=${APP_URL}/">
          </head><body><p>Unick переехал: <a href="${APP_URL}/">${APP_URL}</a></p></body></html>
          HTML
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
